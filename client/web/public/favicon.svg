<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Subtle drop shadow / depth -->
  <defs>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#emeraldGrad)"/>

  <!-- Landmark Cooperative Emblem -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Triangular Roof / Pediment -->
    <path d="M32 12L51 22H13L32 12Z"/>
    
    <!-- Top Beam / Architrave -->
    <rect x="13" y="24" width="38" height="3" rx="1.5"/>

    <!-- Pillars (Classic 4-Pillar Financial Stability) -->
    <rect x="16" y="29" width="5" height="17" rx="1.5"/>
    <rect x="25" y="29" width="5" height="17" rx="1.5"/>
    <rect x="34" y="29" width="5" height="17" rx="1.5"/>
    <rect x="43" y="29" width="5" height="17" rx="1.5"/>

    <!-- Base / Foundation -->
    <rect x="13" y="47" width="38" height="3" rx="1.5"/>
    <rect x="11" y="51" width="42" height="3" rx="1.5"/>
  </g>
</svg>
